name: Build APK Claude Auto

on:
  push:
    paths:
      - 'android-chatbot/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '7.5'

      - name: Build Release APK
        working-directory: android-chatbot
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: ClaudeAuto-APK
          path: android-chatbot/app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
